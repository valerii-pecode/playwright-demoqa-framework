name: Launch selected tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run tests on (chromium, firefox, webkit)"
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        required: false
      testName:
        description: 'Run a specific test by name (takes precedence)'
        required: false
        default: ''
      testPath:
        description: 'Run all tests in a specific file in tests folder (second precedence)'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TEST_BROWSER: ${{ inputs.browser }}
      TEST_NAME: ${{ inputs.testName }}      
      TEST_PATH: ${{ inputs.testPath }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Debug input values
        run: |
          echo "Browser: $TEST_BROWSER"
          echo "Test path: $TEST_PATH"
          echo "Test name: $TEST_NAME"    

      - name: Run Playwright tests
        env:
          CI: true
        run: |
          echo "Browser: ${{ env.TEST_BROWSER }}"
    
          if [ -n "${{ env.TEST_NAME }}" ]; then
            echo "Running specific test by name: ${{ env.TEST_NAME }}"
            npx playwright test --project=${{ env.TEST_BROWSER }} -g "${{ env.TEST_NAME }}"
          elif [ -n "${{ env.TEST_PATH }}" ]; then
            echo "Running all tests in file: ${{ env.TEST_PATH }}"
            npx playwright test ${{ env.TEST_PATH }} --project=${{ env.TEST_BROWSER }}
          else
            echo "Running full test suite"
            npx playwright test --project=${{ env.TEST_BROWSER }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 5
